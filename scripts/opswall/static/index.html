<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ops wall — Self-Healing IT</title>
  <link rel="icon" type="image/svg+xml" href="/static/confluent-mark.svg" />
  <link rel="stylesheet" href="/static/opswall.css" />
</head>
<body>
  <div class="page">
    <header class="top">
      <div class="title">
        <h1>Ops wall</h1>
        <span class="subtitle">Releases, incidents and live signals</span>
      </div>
      <div class="clock">
        <span class="updated">Updated <time id="updated">—</time></span>
        <span id="conn" class="conn connecting"><span class="lamp" aria-hidden="true"></span><span class="conn-label">Connecting…</span></span>
      </div>
    </header>

    <main class="wall" id="rows"></main>
  </div>

  <div class="tip" id="tip" role="tooltip"></div>

  <script src="/static/opswall.js"></script>
</body>
</html>
